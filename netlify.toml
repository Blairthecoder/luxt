[build]
  command = "node scripts/sync-catalog.mjs && node scripts/sync-lovense.mjs && vite build"
  publish = "dist/client"
[build.environment]
  # sync-catalog.mjs relies on the global fetch in Node 18+
  NODE_VERSION = "22"
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Preview copies must never be indexed: pages render meta robots noindex and
# Netlify's default X-Robots-Tag stays on.
[context.deploy-preview.environment]
  VITE_NOINDEX = "1"
[context.branch-deploy.environment]
  VITE_NOINDEX = "1"

# Response headers. Vite fingerprints everything under /assets, so it can be
# cached for a year; the rest of the site keeps Netlify's default revalidation.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
